<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adapt - Episode Chapter Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="app" aria-label="Anime episode and manga chapter finder">
        <header class="brand">
          <div class="wordmark">adapt<span>.</span></div>
          <div class="kicker">episode <span>↔</span> chapter finder</div>
        </header>

        <form class="panel" id="lookup-form">
          <label class="field">
            <span>Series</span>
            <input id="anime" name="anime" list="series-options" autocomplete="off" spellcheck="false" placeholder="e.g. One Piece">
            <datalist id="series-options"></datalist>
          </label>

          <div class="mode-toggle" id="mode-toggle" role="group" aria-label="Lookup type">
            <button type="button" class="mode-btn active" id="mode-episode" data-mode="episode">Episode</button>
            <button type="button" class="mode-btn" id="mode-movie" data-mode="movie">Movie</button>
            <button type="button" class="mode-btn" id="mode-arc" data-mode="arc">Arc</button>
            <button type="button" class="mode-btn" id="mode-fillers" data-mode="fillers">Fillers</button>
            <button type="button" class="mode-btn" id="mode-start" data-mode="start">Start reading</button>
          </div>

          <div class="converter" id="converter">
            <label class="tile" id="from-tile">
              <span id="from-label">Episode</span>
              <input id="number" name="number" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="1090">
              <input id="movie-name" name="movieName" autocomplete="off" spellcheck="false" placeholder="e.g. Infinity Castle" hidden>
              <input id="arc-name" name="arcName" autocomplete="off" spellcheck="false" placeholder="e.g. Marineford" hidden>
            </label>

            <button class="swap" id="swap" type="button" title="Swap direction" aria-label="Swap direction">
              ↔
            </button>

            <div class="tile result-tile" id="result-tile" aria-live="polite">
              <span class="tile-head" id="to-label">Chapter</span>
              <span class="answer answer-idle" id="answer">—</span>
            </div>
          </div>

          <button class="find" id="find" type="submit" disabled>
            <span id="find-label">Find match</span>
            <span class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
        </form>

        <section class="meta" id="meta" hidden>
          <p id="result-sentence"></p>
          <dl id="details" class="details" hidden></dl>
          <div class="source-row">
            <span id="cache-badge" class="badge" hidden>cached</span>
            <a id="source-link" href="#" target="_blank" rel="noreferrer" hidden>source</a>
            <button type="button" id="share-btn" class="chip-btn share" hidden>Copy link</button>
            <button type="button" id="recheck-btn" class="chip-btn recheck" hidden>Wrong? Re-check</button>
          </div>
        </section>

        <section class="recents" id="recents-wrap" hidden>
          <div class="recents-title">Recent</div>
          <div class="recents-list" id="recents"></div>
        </section>

        <p class="footnote">Only explicit source text is accepted. No clear source means no match.</p>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
